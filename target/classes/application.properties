# ===================================================================
# Lumin Consultancy Platform Configuration (application.properties)
# ===================================================================

# -------------------------------------------------------------------
# Server & Network Configuration
# -------------------------------------------------------------------
# Embedded web server port (defaults to 8080, can be overridden by hosting environments via $PORT)
server.port=${PORT:8080}

# Forwarded headers strategy for reverse proxies (e.g. Nginx, Cloudflare, Railway)
server.forward-headers-strategy=framework

# -------------------------------------------------------------------
# Mail & Notification Settings
# -------------------------------------------------------------------
# Destination inbox that receives all prospective consultation leads
lumin.enquiry.to=${ENQUIRY_TO:ceo.lumin@gmail.com}

# Outbound SMTP relay configuration (defaults to Gmail TLS on port 587)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}

# Originating SMTP credentials (use an App Password if using Gmail 2FA)
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}

# SMTP Protocol security and authentication flags
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Connection timeouts (8000ms) to ensure non-blocking email dispatch
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# -------------------------------------------------------------------
# Database Configuration (MySQL)
# -------------------------------------------------------------------
# Cloud / Production template (Railway deployment example):
