# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Local development MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/lumindb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Hibernate / JPA Configuration
# -------------------------------------------------------------------
# Automatically update relational schema to match JPA entity annotations on startup
spring.jpa.hibernate.ddl-auto=update

# Enable logging of generated SQL queries to stdout for debugging
spring.jpa.show-sql=true

# Hibernate dialect specification for MySQL 8.x
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


