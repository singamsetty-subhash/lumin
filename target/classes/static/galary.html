<!DOCTYPE html>
<!--
  Lumin Consultancy - Gallery Typo Redirect Fallback Page
  Handles incoming links or user typing with common misspelling ("galary" -> "gallery")
  and smoothly redirects client browsers to gallery.html via meta-refresh and JS.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to Gallery...</title>
  <meta http-equiv="refresh" content="0; url=gallery.html">
  <link rel="canonical" href="gallery.html">
  <script>
    window.location.replace("gallery.html");
  </script>
</head>
<body>
  <p>Redirecting to <a href="gallery.html">Gallery</a>...</p>
</body>
</html>
